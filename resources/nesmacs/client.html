<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nesmacs</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <script defer src="/vendor/xterm.js"></script>
  <script defer src="/vendor/addon-fit.js"></script>
  <script defer src="/vendor/addon-unicode11.js"></script>
  <script defer src="/client.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1a1a1a; }
    #editor { width: 100%; height: 100%; }
    #connection {
      position: fixed;
      inset: 0.5rem 0.5rem auto auto;
      z-index: 1;
      max-width: calc(100% - 2rem);
      padding: 0.4rem 0.65rem;
      border: 1px solid #817a6a;
      border-radius: 0.25rem;
      background: #28251f;
      color: #f4e9cf;
      font: 0.875rem/1.4 system-ui, sans-serif;
      pointer-events: none;
    }
    #connection:empty { visibility: hidden; }
  </style>
</head>
<body>
  <main id="editor" aria-label="Nesmacs editor"></main>
  <div id="connection" role="status">Connecting to Nesmacs…</div>
</body>
</html>
